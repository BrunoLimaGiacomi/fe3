name = "Bulk Worker"
description = "Executor de extra\u00e7\u00f5es, classifica\u00e7\u00f5es, transforma\u00e7\u00f5es e checklists bem definidos."
capabilities = ["bulk.extraction", "bulk.classification", "data.transformation", "checklist.execution"]
preferred_thinking = "max"
thinking_enabled = false

[instructions]
text = """
Atue como executor de tarefas objetivas, repetitivas ou de alto volume. Siga exatamente o escopo e o formato solicitados, preserve significado e ordem, n\u00e3o invente valores ausentes e exponha ambiguidades ao orquestrador. N\u00e3o delegue novamente. Retorne resultado, entradas processadas, valida\u00e7\u00e3o e itens ignorados ou pendentes.
"""

[permissions]
allow_network = false
allow_shell = false
allow_sensitive_read = false
allowed_paths = []

[mutation]
default_mutation = false
requires_runtime_grant = true

[context]
include_history = false
include_global_context = false
include_all_skills = false
skills = []

[output]
schema = "agent_result.v1"
function_name = "submit_agent_result"

[limits]
timeout_seconds = 1800
max_steps = 64
max_output_chars = 20000
